schema_version: "1.0"
output_root: ${PRIMA_CAMPAIGN_OUTPUT}
provider:
  kind: ollama
  model: ${PRIMA_CAMPAIGN_MODEL}
  revision: ${PRIMA_CAMPAIGN_MODEL_REVISION}
  endpoint: ${PRIMA_CAMPAIGN_ENDPOINT}
  health_path: /api/tags
  context_window: 32768
  structured_output: true
  timeout_seconds: 120
  retries: 2
scheduler:
  mode: interleaved
  max_gpu_requests: 1
  cpu_workers: 3
  gpu_devices: ["0"]
benchmarks:
  - id: goemotions-schema
    benchmark: goemotions
    dataset_path: ${GOEMOTIONS_TEST_FILE}
    profile: affect_only
    variant: schema_constrained_model_only
    context_budget: 2048
    options: {split: test, batch_size: 8}
  - id: hotpotqa-prima
    benchmark: hotpotqa
    dataset_path: ${HOTPOTQA_FILE}
    profile: prima_full
    variant: distractor
    context_budget: 16384
  - id: locomo-prima
    benchmark: locomo
    dataset_path: ${LOCOMO_FILE}
    profile: prima_full
    variant: normal_prima_admission
    context_budget: 32768
    optional_metrics: [rouge_l]
    options: {full_dataset: true}
