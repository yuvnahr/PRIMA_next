# One matched GoEmotions session; this configuration is not a budget/resource admission.
# Use the pinned-source canonical notebook's fresh gate/monitor for production.
# Run LoCoMo or extra baselines in separate independently admitted sessions.
schema_version: "1.0"
output_root: ${PRIMA_CAMPAIGN_OUTPUT}
repository:
  url: https://github.com/yuvnahr/PRIMA_next.git
  requested_ref: dev
  commit_sha: ${PRIMA_REVIEWED_DEV_SHA}
  require_clean_pinned_source: true
provider:
  kind: ollama
  model: qwen3.8:27b
  revision: aaee06c39dcf2437cde036998d960e1fc1494b8191be7cc9657d01e509097813
  endpoint: ${PRIMA_CAMPAIGN_ENDPOINT}
  health_path: /api/tags
  context_window: 8192
  max_output_tokens: 512
  safety_overhead_tokens: 512
  structured_output: true
  timeout_seconds: 180
  retries: 1
scheduler:
  mode: sequential
  max_gpu_requests: 1
  cpu_workers: 1
  ollama_parallel_slots: 1
  gpu_devices: ["0", "1"]
  min_free_disk_gb: 5
runtime:
  affect_backend: legacy
  embedding_backend: stable
  embedding_dimensions: 64
  embedding_device: cpu
  reranker_device: cpu
  reflection_enabled: false
benchmarks:
  - id: goemotions-preserve-labels
    benchmark: goemotions
    dataset_path: ${GOEMOTIONS_TEST_FILE}
    profile: affect_only
    variant: affect_telemetry_preserve_labels
    context_budget: 6144
    max_items: 0
    options: {split: test, batch_size: 1, device: cpu, prompt_variant: definitions_schema, comparison_mode: same_response}
