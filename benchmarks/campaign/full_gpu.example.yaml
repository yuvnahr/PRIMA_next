schema_version: "1.0"
output_root: ${PRIMA_CAMPAIGN_OUTPUT}
provider:
  kind: ollama
  model: ${PRIMA_CAMPAIGN_MODEL}
  revision: ${PRIMA_CAMPAIGN_MODEL_REVISION}
  endpoint: ${PRIMA_CAMPAIGN_ENDPOINT}
  health_path: /api/tags
  context_window: 32768
  structured_output: true
  timeout_seconds: 120
  retries: 2
scheduler:
  mode: interleaved
  max_gpu_requests: 1
  cpu_workers: 3
  gpu_devices: ["0"]
benchmarks:
  - id: goemotions-schema
    benchmark: goemotions
    dataset_path: ${GOEMOTIONS_TEST_FILE}
    profile: affect_only
    variant: schema_constrained_model_only
    context_budget: 2048
    options: {split: test, batch_size: 8}
  - id: hotpotqa-model-only
    benchmark: hotpotqa
    dataset_path: ${HOTPOTQA_FILE}
    profile: model_only
    variant: distractor
    context_budget: 16384
  - id: hotpotqa-simple-rag
    benchmark: hotpotqa
    dataset_path: ${HOTPOTQA_FILE}
    profile: simple_rag
    variant: distractor
    context_budget: 16384
  - id: hotpotqa-prima-full
    benchmark: hotpotqa
    dataset_path: ${HOTPOTQA_FILE}
    profile: prima_full
    variant: distractor
    context_budget: 16384
  - id: locomo-model-only
    benchmark: locomo
    dataset_path: ${LOCOMO_FILE}
    profile: model_only
    variant: controlled_document_ingestion
    context_budget: 16384
    options: {full_dataset: true}
  - id: locomo-simple-rag
    benchmark: locomo
    dataset_path: ${LOCOMO_FILE}
    profile: simple_rag
    variant: controlled_document_ingestion
    context_budget: 16384
    options: {full_dataset: true}
  - id: locomo-prima-full
    benchmark: locomo
    dataset_path: ${LOCOMO_FILE}
    profile: prima_full
    variant: controlled_document_ingestion
    context_budget: 16384
    optional_metrics: [rouge_l]
    options: {full_dataset: true}
comparisons:
  - {id: hotpot-model-vs-full, left: hotpotqa-model-only, right: hotpotqa-prima-full, metric: metrics.joint_f1}
  - {id: hotpot-rag-vs-full, left: hotpotqa-simple-rag, right: hotpotqa-prima-full, metric: metrics.joint_f1}
  - {id: locomo-model-vs-full, left: locomo-model-only, right: locomo-prima-full, metric: metrics.f1}
  - {id: locomo-rag-vs-full, left: locomo-simple-rag, right: locomo-prima-full, metric: metrics.f1}
