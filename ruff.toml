line-length = 100
target-version = "py310"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "pytest-cache-files-*",
    "pytest-tmp",
    "benchmarks/**/external",
    "build",
    "dist"
]

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101", # tests use assert-style helpers through unittest in some checks
    "S110", # optional dependency fallbacks intentionally continue silently
    "B904", # provider wrappers preserve concise user-facing request errors
    "E501", # this codebase permits long declarative lines
    "E701", # this codebase permits compact guard clauses
    "E702", # this codebase permits compact sequential statements
    "E731", # this codebase permits tiny local callables in scripts/tests
    "B905", # zip strictness is noisy on existing list-shaped benchmark code
    "S105", # enum values are not passwords
    "S310", # provider layer intentionally opens configured HTTP URLs
    "S311", # deterministic benchmark sampling is not cryptographic
    "S607", # git is invoked from PATH for repository metadata
    "I001", # keep compact script imports stable under the current style
]