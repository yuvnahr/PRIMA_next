name: Dependency audit

on:
  schedule:
    - cron: '31 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"
      - run: python -m pip install --only-binary=':all:' pip-audit==2.10.1
      - name: Audit frozen Linux and Windows resolutions
        run: |
          result=0
          for lock in requirements-linux-py314.lock.txt requirements-win-py314.lock.txt; do
            # Audit package versions without installing any locked packages.
            python -m pip_audit --disable-pip --no-deps -r "$lock" || result=1
          done
          # PyPI advisories use the upstream public version for the pinned CPU wheel.
          sed -nE 's#^torch @ https://download-r2\.pytorch\.org/whl/cpu/torch-([0-9]+\.[0-9]+\.[0-9]+)%2Bcpu-.*#torch==\1#p' \
            requirements-linux-py314.lock.txt > "$RUNNER_TEMP/torch-advisory.txt"
          test -s "$RUNNER_TEMP/torch-advisory.txt"
          python -m pip_audit --disable-pip --no-deps -r "$RUNNER_TEMP/torch-advisory.txt" || result=1
          exit "$result"
