name: PRIMA-NEXT CI

on:
  push:
    branches:
      - master
      - dev
      - feature/**
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: pytest -v

      - name: Run Ruff
        run: ruff check .

      - name: Run Xenon
        run: python scripts/run_xenon.py

      - name: Run MyPy
        run: mypy .

      - name: Run Bandit
        run: bandit -q -c bandit.yaml -r .
