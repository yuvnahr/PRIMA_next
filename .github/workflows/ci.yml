name: PRIMA-NEXT CI

on:
  push:
    branches:
      - master
      - dev
      - feature/**
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report Optional Capabilities
        run: python -m benchmarks.preflight --json

      - name: Compile Owned Python Sources
        run: python -m compileall -q -x '(^|[\\/])(\.git|\.venv|venv|external)([\\/]|$)' .

      - name: Run Pytest
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Xenon
        run: python scripts/run_xenon.py

      - name: Run MyPy
        run: python -m mypy .

      - name: Run Bandit
        run: python -m bandit -q -c bandit.yaml -r .
