[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    ".pytest_cache",
    "pytest-cache-files-*",
    "pytest-tmp",
    "benchmarks/**/external",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101", # tests use assert-style helpers through unittest in some checks
    "S110", # optional dependency fallbacks intentionally continue silently
    "B904", # provider wrappers preserve concise user-facing request errors
    "E501", # this codebase permits long declarative lines
    "E701", # this codebase permits compact guard clauses
    "E702", # this codebase permits compact sequential statements
    "E731", # this codebase permits tiny local callables in scripts/tests
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
ignore_errors = true
exclude = [
    "__pycache__",
]

[tool.bandit]
exclude_dirs = ["tests", ".git", ".venv", "__pycache__"]
