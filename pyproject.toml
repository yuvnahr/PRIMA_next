[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101", # tests use assert-style helpers through unittest in some checks
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
exclude = [
    "__pycache__",
]

[tool.bandit]
exclude_dirs = ["tests", ".git", ".venv", "__pycache__"]
