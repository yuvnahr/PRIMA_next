[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:SelectableGroups dict interface is deprecated\\. Use select\\.:DeprecationWarning:opentelemetry\\.util\\._importlib_metadata",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101", # tests use assert-style helpers through unittest in some checks
    "S110", # optional dependency fallbacks intentionally continue silently
    "B904", # provider wrappers preserve concise user-facing request errors
    "E501", # this codebase permits long declarative lines
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
ignore_errors = true
exclude = [
    "__pycache__",
    "benchmarks/locomo-v2/external|benchmarks/locomo/external",
]
